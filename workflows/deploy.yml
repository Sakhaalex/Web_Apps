name: Deploy All Apps to Pages

on:
  push:
    branches: ["main"] # Change to "master" if your default branch is named master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload entire repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # This uploads the root, keeping all subfolders intact

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
