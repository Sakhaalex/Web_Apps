<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Creations | Web Apps</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Noto Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Marked.js for dynamic Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        body {
            font-family: 'Noto Sans', sans-serif;
            background-color: #FFFFFF;
            color: #202124;
        }
        
        /* Dynamic Markdown Injection Styles */
        #dynamic-content h1 { font-size: 2.25rem; font-weight: 700; margin-bottom: 1rem; color: #202124; }
        #dynamic-content h2 { font-size: 1.5rem; font-weight: 700; margin-top: 2.5rem; margin-bottom: 1rem; border-bottom: 1px solid #F1F3F4; padding-bottom: 0.5rem; }
        #dynamic-content p { font-size: 1rem; line-height: 1.75; color: #3C4043; margin-bottom: 1.25rem; }
        
        /* Styling the Markdown Table for the App Directory */
        #dynamic-content table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 3px rgba(60,64,67,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        #dynamic-content th, #dynamic-content td {
            border: 1px solid #E8EAED;
            padding: 1rem;
            text-align: left;
        }
        #dynamic-content th {
            background-color: #F8F9FA;
            font-weight: 600;
            color: #202124;
        }
        #dynamic-content tr:hover td {
            background-color: #F8F9FA;
        }
        #dynamic-content a {
            color: #1A73E8;
            font-weight: 500;
            text-decoration: none;
        }
        #dynamic-content a:hover {
            text-decoration: underline;
        }
        #dynamic-content em {
            color: #80868B;
            font-size: 0.875rem;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Header / Branding -->
    <header class="w-full max-w-5xl mx-auto px-6 py-12 flex items-center justify-between border-b border-[#F1F3F4]">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-[#F8F9FA] rounded-full flex items-center justify-center border border-[#E8EAED] overflow-hidden">
                <img src="logo.svg" alt="Alex Creations Logo" class="w-full h-full object-cover" onerror="this.style.display='none'">
            </div>
            <div>
                <h1 class="text-xl font-bold text-[#202124] tracking-tight">Alex Creations</h1>
                <p class="text-sm text-[#5F6368]">Application Portfolio</p>
            </div>
        </div>
        <div>
            <a href="https://github.com/Sakhaalex" target="_blank" class="text-sm font-medium text-[#1A73E8] hover:underline">
                View GitHub Profile
            </a>
        </div>
    </header>

    <!-- Main Content (Populated from README.md) -->
    <main class="w-full max-w-5xl mx-auto px-6 py-12 flex-grow">
        <div id="dynamic-content">
            <p class="text-center text-[#80868B]">Loading portfolio data...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-5xl mx-auto px-6 py-8 border-t border-[#F1F3F4] text-center">
        <p class="text-sm text-[#80868B]">© 2026 Alex Creations. All rights reserved.</p>
    </footer>

    <!-- Fetch Logic -->
    <script>
        async function loadReadme() {
            const container = document.getElementById('dynamic-content');
            // Fetching the raw README.md directly from your main branch
            const readmeUrl = "https://raw.githubusercontent.com/Sakhaalex/Web_Apps/main/README.md";
            
            try {
                const response = await fetch(readmeUrl);
                if (!response.ok) throw new Error("Failed to fetch README");
                const rawMarkdown = await response.text();
                
                // Render the markdown into the container
                container.innerHTML = marked.parse(rawMarkdown);
            } catch (error) {
                console.error("Error loading README:", error);
                container.innerHTML = `<p class="text-red-500">Could not load the directory at this time. Please visit the <a href="https://github.com/Sakhaalex/Web_Apps">GitHub repository</a> directly.</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadReadme);
    </script>

</body>
</html>
